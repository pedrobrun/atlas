<title>Atlas</title>
<style>
:root {
  --ink: #1d1c1a; --ink-2: #57544d; --ink-3: #8e8a81; --line: rgba(30, 28, 24, .1);
  --card: rgba(255, 255, 255, .86); --chip: rgba(0, 0, 0, .05);

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --ink: #eceae5; --ink-2: #b3afa6; --ink-3: #7f7b73; --line: rgba(255, 255, 255, .1); --card: rgba(30, 30, 28, .86); --chip: rgba(255, 255, 255, .07);

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; color: var(--ink);
  background: radial-gradient(ellipse at 50% 30%, var(--bg1), var(--bg2)); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
#stage { position: fixed; inset: 0; }

#labels { position: fixed; inset: 0; pointer-events: none; }

.bar { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; pointer-events: none; z-index: 5; }

.pill { background: var(--card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; box-shadow: 0 6px 24px rgba(0,0,0,.06); display: flex; align-items: center; gap: 8px; }
.brand { font-weight: 680; letter-spacing: -.01em; }

.crumbs button { color: var(--ink-3); padding: 2px 4px; border-radius: 6px; }
.crumbs button:hover { color: var(--ink); background: var(--chip); }
.crumbs button.cur { color: var(--ink); font-weight: 620; }
.crumbs .sep { color: var(--ink-3); }
.seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; }
.seg button { padding: 3px 9px; border-radius: 6px; color: var(--ink-2); font-size: 12px; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.lbl { color: var(--ink-3); font-size: 11.5px; }
.spacer { flex: 1; }
.stale { color: var(--warn); font-size: 12px; }
.stale::before { content: "●"; margin-right: 5px; }
select { font: inherit; font-size: 12px; color: var(--ink); background: var(--chip); border: 0; border-radius: 8px; padding: 4px 8px; }

.hint kbd { font: 11px var(--mono); background: var(--chip); border-radius: 4px; padding: 1px 5px; }
#up { position: fixed; left: 16px; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); z-index: 5; }

#card { position: fixed; top: calc(70px + env(safe-area-inset-top, 0px)); left: 66px; width: min(380px, calc(100vw - 82px)); max-height: calc(100vh - 100px); overflow: auto; z-index: 6;
  background: var(--card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 18px; box-shadow: 0 12px 40px rgba(0,0,0,.1);

#card, #chat { transition: transform .32s cubic-bezier(.2,.8,.2,1), opacity .25s; }
#card.collapsed { transform: translateX(calc(-100% - 80px)); opacity: 0; pointer-events: none; }
#chat.collapsed { transform: translateX(calc(-100% - 80px)); opacity: 0; pointer-events: none; }

#rail button { width: 32px; padding: 10px 0; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; font-weight: 650; }
#rail button:hover { color: var(--ink); background: var(--chip); }

.hint, #up { transition: left .32s cubic-bezier(.2,.8,.2,1); }
#card h2 { font-size: 17px; margin: 0; letter-spacing: -.015em; line-height: 1.25; }
#card h3 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 16px 0 6px; font-weight: 650; }
#card .kind { color: var(--ink-3); font-size: 12px; margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#card .lede { font-size: 13.5px; margin: 10px 0 0; }
#card .lede.second { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
#card .none { color: var(--ink-3); font-style: italic; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; border-radius: 999px; padding: 1px 8px; background: var(--chip); color: var(--ink-2); }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
.dot { width: 8px; height: 8px; border-radius: 3px; display: inline-block; flex: none; }
.staleBox { margin-top: 10px; border-left: 3px solid var(--warn); padding: 6px 10px; font-size: 12px; background: color-mix(in srgb, var(--warn) 9%, transparent); border-radius: 0 8px 8px 0; }
.ev { font: 11.5px var(--mono); color: var(--accent); word-break: break-all; }
.evn { color: var(--ink-3); font-size: 11.5px; margin-bottom: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 5px; }
.nb { font-size: 12px; background: var(--chip); border-radius: 7px; padding: 3px 8px; display: inline-flex; gap: 6px; align-items: center; }
.nb:hover { outline: 1px solid var(--accent); }
.nb small { color: var(--ink-3); }
.it { display: block; width: 100%; text-align: left; background: var(--chip); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
.it:hover { outline: 1px solid var(--accent); }
.it b { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-weight: 620; }
.it span { display: block; color: var(--ink-2); font-size: 12px; margin-top: 2px; }
.steps { list-style: none; margin: 8px 0 0; padding: 0; }
.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 6px 6px; border-radius: 10px; cursor: pointer; }

.steps li.on { background: color-mix(in srgb, var(--flow) 12%, transparent); }

.steps .t { font-size: 12.5px; }
.steps .u { font-size: 11.5px; color: var(--ink-3); }
.flowNav { display: flex; gap: 6px; margin-top: 10px; }
.flowNav button { flex: 1; background: var(--chip); border-radius: 8px; padding: 6px; font-weight: 600; }
.flowNav button:hover { background: color-mix(in srgb, var(--flow) 15%, transparent); }
.x { position: absolute; top: 10px; right: 12px; color: var(--ink-3); font-size: 16px; }

.lab { pointer-events: none; transform: translateY(-4px); text-align: center; white-space: nowrap; transition: opacity .3s; }
.lab .n { display: inline-block; font-size: 12px; font-weight: 620; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 2px 7px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.lab .s { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 2px; max-width: 220px; white-space: normal; text-shadow: 0 0 6px var(--bg1); }
.lab.big .n { font-size: 14px; padding: 4px 10px; }
.lab.ctx { opacity: .55; }
.lab.ctx .n { font-weight: 500; }
.lab.small .n { font-size: 10.5px; padding: 1px 5px; font-weight: 520; }
.lab.step .n { background: var(--flow); color: #fff; border-color: transparent; }
.lab.arc .n { font-size: 10.5px; font-weight: 520; color: var(--ink-2); }
#tip { position: fixed; z-index: 7; pointer-events: none; background: var(--card); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 12px; max-width: 280px; box-shadow: 0 6px 20px rgba(0,0,0,.1); }
#tip b { display: block; }
#tip span { color: var(--ink-2); }
#tip em { display: block; color: var(--ink-3); font-style: normal; font-size: 11px; margin-top: 3px; }
#chat { position: fixed; top: calc(70px + env(safe-area-inset-top, 0px)); left: 66px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100vw - 82px)); z-index: 6;
  display: flex; flex-direction: column; background: var(--card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.1); }
#chat .head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
#chat .head b { font-size: 13.5px; } #chat .head small { color: var(--ink-3); font-size: 11.5px; } #chat .head .x { position: static; margin-left: auto; }
#msgs { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-radius: 14px 14px 4px 14px; padding: 7px 11px; max-width: 88%; white-space: pre-wrap; }
.msg.bot { font-size: 13px; line-height: 1.5; }
.msg.bot p { margin: 0 0 8px; } .msg.bot ul, .msg.bot ol { margin: 0 0 8px; padding-left: 18px; } .msg.bot li { margin-bottom: 3px; }
.msg.bot code { font: 11.5px var(--mono); background: var(--chip); border-radius: 4px; padding: 0 4px; word-break: break-all; }
.msg .status { font: 11px var(--mono); color: var(--ink-3); margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }

@keyframes blink { 50% { opacity: .2; } }
.cite { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; background: var(--chip); border-radius: 6px; padding: 0 6px; margin: 0 1px; vertical-align: 1px; }

#caption { position: fixed; left: 50%; bottom: calc(46px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 5; width: min(600px, calc(100vw - 32px));

body.paneled #caption { left: calc(50% + 225px); width: min(600px, calc(100vw - 500px)); }
#caption .k { font-size: 11px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

#caption .d { font-size: 13.5px; }
#caption .t { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
#caption .t code { font: 11px var(--mono); color: var(--accent); }
#caption .wait::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 7px; animation: blink 1s infinite; }
#caption .nav { position: absolute; right: 12px; top: 10px; display: flex; gap: 4px; }
#caption .nav button { background: var(--chip); border-radius: 7px; width: 28px; height: 24px; font-weight: 700; }
.draftCard { margin-top: 8px; border: 1px solid color-mix(in srgb, var(--flow) 45%, transparent); border-radius: 12px; padding: 10px 12px; background: color-mix(in srgb, var(--flow) 6%, transparent); }
.draftCard .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--flow); font-weight: 700; }
.draftCard b { display: block; font-size: 13.5px; margin: 2px 0; }
.draftCard p { margin: 0 0 6px; color: var(--ink-2); font-size: 12px; }
.draftCard ol { margin: 0 0 8px; padding-left: 18px; font-size: 12px; color: var(--ink-2); }
.draftCard .acts { display: flex; gap: 6px; }
.draftCard .acts button { flex: 1; border-radius: 8px; padding: 6px; font-weight: 600; background: var(--chip); }
.draftCard .acts button.pri { background: var(--flow); color: #fff; }
.draftCard .acts button:disabled { opacity: .6; }
.lit { margin-top: 4px; display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: #b26d00; }
.lit button { color: var(--ink-3); text-decoration: underline; }
.sugg { display: grid; gap: 6px; } .sugg button { text-align: left; background: var(--chip); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; } .sugg button:hover { outline: 1px solid var(--accent); }
.empty { color: var(--ink-2); font-size: 12.5px; }
.empty code { font: 11.5px var(--mono); background: var(--chip); border-radius: 4px; padding: 1px 5px; }
#chat form { border-top: 1px solid var(--line); padding: 10px; display: grid; gap: 6px; }
#about { font-size: 11px; color: var(--ink-3); } #about b { color: var(--ink-2); font-weight: 600; }
#chat .row2 { display: flex; gap: 8px; align-items: flex-end; }
#q { flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--chip); border: 0; border-radius: 10px; padding: 8px 10px; max-height: 120px; outline: none; }
#q:focus { box-shadow: 0 0 0 2px var(--accent); }
#send { background: var(--accent); color: #fff; border-radius: 10px; padding: 7px 12px; font-weight: 600; }
#send:disabled { opacity: .4; }
body.paneled .hint, body.paneled #up { left: 462px; }
.hint { left: 66px !important; } body.paneled .hint { left: 462px !important; } #up { left: 66px; }
.lab.hl .n { background: #f2a71b; color: #2a1a00; border-color: transparent; }
@media (max-width: 700px) { #chat { bottom: auto; height: 50vh; } }
@media (max-width: 700px) { #card { top: auto; bottom: 12px; max-height: 45vh; } .hint { display: none; } }
</style>

  qEl.placeholder = t('placeholder');
  const a = aboutNow();
  document.getElementById('about').innerHTML = a ? `${t('about')}: <b>${esc(a.label)}</b>` : '';
  if (!msgsEl.children.length && !busy) {
    msgsEl.innerHTML = served
      ? `<div class="sugg">${[...t('sugg'), ...(D.config.suggestions?.[state.lang] || [])].map((q) => `<button data-ask="${esc(q)}">${esc(q)}</button>`).join('')}</div>`
      : `<p class="empty">${t('needServe')}</p>`;
  }
  sendEl.disabled = busy || !served;
}
async function ask(q) {
  if (busy || !q.trim() || !served) return;
  if (msgsEl.querySelector('.sugg, .empty')) msgsEl.innerHTML = '';
  busy = true; renderChat();
  msgsEl.insertAdjacentHTML('beforeend', `<div class="msg user">${esc(q)}</div><div class="msg bot"><div class="status">${t('thinking')}</div><div class="body"></div></div>`);
  const bot = msgsEl.lastElementChild, status = bot.querySelector('.status'), body = bot.querySelector('.body');
  msgsEl.scrollTop = msgsEl.scrollHeight;
  const a = aboutNow();
  let text = '';
  try {
    const res = await fetch('/chat', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ message: q, session: chatSession, lang: state.lang, about: a ? `${a.kind} ${a.id} (${a.label})` : null }) });
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const ev = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1);
        if (ev.type === 'status') status.textContent = ev.text;
        if (ev.type === 'delta') { text += ev.text; body.innerHTML = md(splitShow(splitFlow(text).text).body); }
        if (ev.type === 'done') {
          if (ev.session) { chatSession = ev.session; try { sessionStorage.setItem('atlasChat', chatSession); } catch {} }
          if (ev.text) text = ev.text;
          if (ev.error) text = text || `${t('chatErr')} (${ev.error})`;
        }
      }
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }
  } catch (e) { text = text || `${t('chatErr')}: ${e.message}`; }
  status.remove();
  const fl = splitFlow(text);
  const { body: answer, ids } = splitShow(fl.text);
  body.innerHTML = md(answer);
  if (fl.raw) {
    const f = toFlow(fl.raw);
    if (f.steps.length) { drafts[f.id] = f; FLOW[f.id] = f; bot.insertAdjacentHTML('beforeend', draftCard(f)); }
  }
  if (ids.length) {
    bot.insertAdjacentHTML('beforeend', `<div class="lit">● ${ids.length} ${t('lit')} <button data-relight="${esc(ids.join(','))}">↺</button> <button data-unlight>${t('clear')}</button></div>`);
    light(ids);
  }
  busy = false; renderChat();
  msgsEl.scrollTop = msgsEl.scrollHeight;
}
async function saveDraft(btn) {
  const f = drafts[btn.dataset.saveflow];
  btn.disabled = true; btn.textContent = t('saving');
  try {
    const r = await fetch('/flows', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(f) });
    if (!r.ok) throw new Error(r.status);
    if (!D.flows.some((x) => x.id === f.id)) D.flows.push({ ...f, local: true });
    btn.textContent = t('saved');
    renderUI();
  } catch (e) { btn.disabled = false; btn.textContent = `${t('saveErr')} (${e.message})`; }
}
// Opening a module with no description asks the agent to read it and describe it and its files, once.
const describing = new Set(), describeFailed = new Set();
async function ensureDescribed(n) {
  if (!served || !n || n.kind !== 'module' || describing.has(n.id) || describeFailed.has(n.id)) return;
  const m = n.ref;
  if (m.desc && m.files.every((f) => f.desc)) return;
  describing.add(n.id); renderCaption();
  try {
    const r = await fetch('/describe', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: n.id }) });
    if (!r.ok) throw new Error(r.status);
    const got = await r.json();
    if (got.module && !m.desc) m.desc = got.module;
    for (const f of m.files) if (got.files?.[f.path]) f.desc = got.files[f.path];
  } catch { (describeFailed.tried ??= new Set()).has(n.id) ? describeFailed.add(n.id) : describeFailed.tried.add(n.id); }
  describing.delete(n.id);
  renderUI();
}
function light(ids) {
  state.flow = ''; state.sel = null; state.hl = ids;
  const lit = [...litSet()];
  const inside = (id, f) => { for (let n = T[id]; n; n = n.parent) if (n === f) return true; return false; };
  let f = T[state.focus] || root;
  while (f !== root && (f.kind === 'group' || !lit.every((id) => inside(id, f)))) f = f.parent;
  state.focus = f.id;
  applyState();
}
document.getElementById('ask').addEventListener('submit', (e) => { e.preventDefault(); const q = qEl.value; qEl.value = ''; qEl.style.height = ''; ask(q); });
qEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('ask').requestSubmit(); } });
qEl.addEventListener('input', () => { qEl.style.height = 'auto'; qEl.style.height = Math.min(qEl.scrollHeight, 120) + 'px'; });
msgsEl.addEventListener('click', (e) => {
  const b = e.target.closest('[data-ask],[data-relight],[data-unlight],[data-preview],[data-saveflow]');
  if (!b) return;
  if (b.dataset.ask) ask(b.dataset.ask);
  if (b.dataset.relight) light(b.dataset.relight.split(','));
  if (b.dataset.unlight !== undefined) { state.hl = null; applyState(); }
  if (b.dataset.preview) { state.hl = null; state.sel = null; state.focus = 'root'; state.flow = b.dataset.preview; state.step = 0; applyState(); }
  if (b.dataset.saveflow) saveDraft(b);
});
// One panel at a time; clicking the active button closes it.
function setPanel(p) { state.panel = state.panel === p ? null : p; renderRail(); fitView(); save(); if (state.panel === 'ask') qEl.focus(); }
function renderRail() {
  card.classList.toggle('collapsed', state.panel !== 'details');
  chatEl.classList.toggle('collapsed', state.panel !== 'ask');
  document.body.classList.toggle('paneled', !!state.panel);
  renderCaption();
  for (const b of document.querySelectorAll('#rail [data-panel]')) b.classList.toggle('on', b.dataset.panel === state.panel);
}
document.getElementById('rail').addEventListener('click', (e) => { const b = e.target.closest('[data-panel]'); if (b) setPanel(b.dataset.panel); });

renderChat();
fitView();
buildScene();
frameFocus();
if (camGoal) { camera.position.copy(camGoal).add(new THREE.Vector3(10, 18, 14)); }
tick();
</script>
